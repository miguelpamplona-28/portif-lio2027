<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐉 Portfólio DBZ — Trabalhos 2027</title>
  <style>
    /* =====================================================
       PALETA DRAGON BALL Z
       ===================================================== */
    :root {
      --bg: #0a0e1a;
      --bg-2: #0f1524;
      --card: #151b2e;
      --card-hover: #1c2340;
      --border: #26304d;
      --orange: #ff7a00;
      --orange-light: #ffa040;
      --orange-dark: #cc5a00;
      --orange-glow: rgba(255, 122, 0, 0.5);
      --yellow: #ffd700;
      --yellow-glow: rgba(255, 215, 0, 0.5);
      --blue: #1e88e5;
      --blue-light: #4faaff;
      --text: #e8ecf5;
      --text-muted: #8891a8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 10% 0%, rgba(255, 122, 0, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(30, 136, 229, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--orange), var(--yellow), var(--blue), transparent);
      box-shadow: 0 0 15px var(--orange);
      z-index: 999;
      animation: kiPulse 3s ease-in-out infinite;
    }

    @keyframes kiPulse {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; box-shadow: 0 0 30px var(--yellow); }
    }

    /* =====================================================
       HEADER
       ===================================================== */
    .header {
      padding: 60px 30px 30px;
      text-align: center;
    }

    .dragon-ball {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff3a0 0%, #ffd700 25%, #ff9d00 70%, #cc5a00 100%);
      position: relative;
      margin: 0 auto 25px;
      box-shadow:
        0 0 30px var(--yellow-glow),
        0 0 60px var(--orange-glow),
        inset -8px -8px 20px rgba(0, 0, 0, 0.3);
      animation: ballFloat 3s ease-in-out infinite;
    }

    .dragon-ball::before {
      content: '★';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #cc0000;
      font-size: 30px;
      text-shadow: 0 0 10px rgba(204, 0, 0, 0.6);
      animation: starTwinkle 2s ease-in-out infinite;
    }

    @keyframes ballFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-8px) rotate(3deg); }
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.15); }
    }

    .title-jp {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(180deg, var(--yellow) 0%, var(--orange) 50%, var(--orange-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      filter: drop-shadow(0 0 20px var(--orange-glow));
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--text);
      margin: 10px 0 5px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .year-badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 22px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 4px;
      border-radius: 4px;
      box-shadow: 0 0 25px var(--orange-glow);
      transform: skew(-5deg);
    }

    /* =====================================================
       CONTAINER / SEÇÕES
       ===================================================== */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    .section-title {
      font-size: 15px;
      color: var(--orange);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 900;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    .section-title::before {
      content: '';
      width: 5px;
      height: 18px;
      background: linear-gradient(180deg, var(--orange), var(--orange-dark));
      box-shadow: 0 0 12px var(--orange);
      border-radius: 2px;
    }

    /* =====================================================
       FORMULÁRIO (recolhível)
       ===================================================== */
    .form-toggle {
      display: flex;
      justify-content: center;
      margin: 20px 0 30px;
    }

    .form-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      display: none;
    }

    .form-box.open { display: block; }

    .form-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--orange), var(--yellow), var(--blue));
      border-radius: 8px 8px 0 0;
    }

    .form-row { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input[type="text"],
    input[type="url"],
    input[type="date"],
    textarea {
      width: 100%;
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-glow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    /* =====================================================
       BOTÕES
       ===================================================== */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
      color: #fff;
      box-shadow: 0 4px 15px var(--orange-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--orange-light) 0%, var(--orange) 100%);
      box-shadow: 0 6px 25px var(--orange-glow);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--blue);
      color: var(--blue-light);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 11px;
    }

    /* =====================================================
       GRID DE TRABALHOS
       ===================================================== */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    .work-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .work-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--orange), var(--yellow));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .work-card:hover {
      background: var(--card-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(255, 122, 0, 0.2);
      border-color: var(--orange);
    }

    .work-card:hover::before { opacity: 1; }

    .work-number {
      display: inline-block;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 12px;
      align-self: flex-start;
      box-shadow: 0 0 10px var(--orange-glow);
    }

    .work-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 6px;
      line-height: 1.3;
    }

    .work-date {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .work-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0 0 18px;
      flex: 1;
    }

    .work-url {
      font-size: 11px;
      color: var(--blue-light);
      text-decoration: none;
      word-break: break-all;
      display: block;
      margin-bottom: 16px;
      padding: 8px 10px;
      background: var(--bg-2);
      border-radius: 4px;
      border: 1px solid var(--border);
      font-family: 'Consolas', monospace;
      transition: all 0.2s ease;
    }

    .work-url:hover {
      border-color: var(--blue);
      color: #fff;
    }

    /* ESFERA DO DRAGÃO CLICÁVEL = ABRIR TRABALHO */
    .open-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px var(--orange-glow);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .open-btn:hover {
      background: linear-gradient(135deg, var(--orange-light) 0%, var(--orange) 100%);
      box-shadow: 0 8px 35px var(--orange-glow), 0 0 50px var(--yellow-glow);
      transform: translateY(-2px) scale(1.02);
    }

    .open-btn .mini-ball {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff3a0 0%, #ffd700 25%, #ff9d00 70%, #cc5a00 100%);
      position: relative;
      box-shadow: 0 0 15px var(--yellow-glow), inset -3px -3px 8px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .open-btn .mini-ball::before {
      content: '★';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #cc0000;
      font-size: 14px;
      font-weight: 900;
      text-shadow: 0 0 6px rgba(204, 0, 0, 0.5);
    }

    .open-btn:hover .mini-ball {
      animation: ballSpin 0.8s linear infinite;
    }

    @keyframes ballSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .work-actions {
      display: flex;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .work-actions .btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 11px;
    }

    /* =====================================================
       EMPTY STATE
       ===================================================== */
    .empty-state {
      text-align: center;
      padding: 70px 20px;
      color: var(--text-muted);
      border: 2px dashed var(--border);
      border-radius: 12px;
      grid-column: 1 / -1;
    }

    .empty-state .icon { font-size: 60px; margin-bottom: 15px; opacity: 0.6; }
    .empty-state .jp {
      font-family: 'Impact', sans-serif;
      font-size: 20px;
      color: var(--orange);
      letter-spacing: 4px;
      margin: 10px 0;
    }
    .empty-state p { margin: 8px 0; font-size: 14px; }

    /* =====================================================
       TOP BAR
       ===================================================== */
    .top-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0 40px;
      flex-wrap: wrap;
    }

    .footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 2px;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    .footer .jp {
      font-family: 'Impact', sans-serif;
      color: var(--orange);
      font-size: 16px;
      letter-spacing: 6px;
      display: block;
      margin-bottom: 8px;
      text-shadow: 0 0 15px var(--orange-glow);
    }

    /* Scroll custom */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-2); }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--orange), var(--orange-dark));
      border-radius: 4px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--card);
      border: 1px solid var(--orange);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(255, 122, 0, 0.3);
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      max-width: 340px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="dragon-ball"></div>
    <h1 class="title-jp">DRAGON BALL Z</h1>
    <div class="title">Portfólio de Trabalhos</div>
    <div class="subtitle">Clique na esfera para abrir o projeto</div>
    <div class="year-badge">2027</div>
  </header>

  <!-- ============ CONTAINER ============ -->
  <div class="container">

    <!-- Barra de ações -->
    <div class="top-bar">
      <button class="btn btn-primary btn-sm" id="toggleFormBtn">➕ Adicionar Trabalho</button>
      <button class="btn btn-secondary btn-sm" id="exportBtn">💾 Exportar JSON</button>
      <button class="btn btn-secondary btn-sm" id="codeBtn">📋 Gerar Código</button>
      <button class="btn btn-secondary btn-sm" id="importBtn">📂 Importar</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>

    <!-- Formulário -->
    <div class="form-box" id="formBox">
      <h2 class="section-title">Novo Trabalho</h2>
      <form id="addForm">
        <div class="form-grid">
          <div class="form-row">
            <label for="workTitle">Título do trabalho *</label>
            <input type="text" id="workTitle" placeholder="Ex: Projeto 01 — Loja Virtual" required />
          </div>
          <div class="form-row">
            <label for="workDate">Data</label>
            <input type="date" id="workDate" />
          </div>
        </div>

        <div class="form-row">
          <label for="workUrl">Link do trabalho (GitHub Pages, Vercel, etc.) *</label>
          <input type="url" id="workUrl" placeholder="https://seuusuario.github.io/projeto/" required />
        </div>

        <div class="form-row">
          <label for="workDesc">Descrição (opcional)</label>
          <textarea id="workDesc" placeholder="O que o trabalho faz? Qual conteúdo usou?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">⚡ Adicionar</button>
      </form>
    </div>

    <!-- Grid de trabalhos -->
    <div class="works-grid" id="worksGrid"></div>
  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <span class="jp">DRAGON BALL Z</span>
    Portfólio 2027 • "It's Over 9000!"
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->
  <script>
    // ============================================
    // ⚠️ IMPORTANTE — EDITE AQUI SEUS TRABALHOS ⚠️
    // ============================================
    // Estes são os trabalhos que APARECEM para o professor.
    // Ao hospedar no GitHub Pages, edite este array com seus links.
    // Exemplo abaixo (substitua pelos seus de verdade):
    //
    //   { id: 1, title: "...", url: "https://...", desc: "...", date: "2027-03-15" }
    //
    const DEFAULT_WORKS = [
      {
        id: 1,
        title: "cadastro",
        url: "https://miguelpamplona-28.github.io/cadastro/index.3.html",
        desc: "Substitua este exemplo pelo seu primeiro trabalho.",
        date: "2027-03-15"
      },
      {
        id: 2,
        title: "calculadora",
        url: "https://miguelpamplona-28.github.io/calculadora/calculadora.html",
        desc: "Substitua este exemplo pelo seu segundo trabalho.",
        date: "2027-04-20"
      }
    ];
    // ============================================

    const STORAGE_KEY = 'dbz_portfolio_links_2027';
    let works = [];

    // ============================================
    // PERSISTÊNCIA
    // ============================================
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        works = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_WORKS));
      } catch (e) {
        console.error('Erro ao carregar:', e);
        works = JSON.parse(JSON.stringify(DEFAULT_WORKS));
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
      } catch (e) {
        console.error('Erro ao salvar:', e);
      }
    }

    // ============================================
    // HELPERS
    // ============================================
    function formatDate(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeUrl(url) {
      url = url.trim();
      if (!url) return '';
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      return url;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    // ============================================
    // RENDER
    // ============================================
    function render() {
      const grid = document.getElementById('worksGrid');

      if (!works.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">🐉</div>
            <p class="jp">NENHUM TRABALHO AINDA</p>
            <p>Clique em <strong>"➕ Adicionar Trabalho"</strong> para começar.</p>
            <p style="font-size:12px;">Cole o link do GitHub Pages e o professor abrirá clicando na esfera!</p>
          </div>
        `;
        return;
      }

      const sorted = [...works].sort((a, b) => {
        if (a.date && b.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
      });

      grid.innerHTML = sorted.map((w) => {
        const idx = works.indexOf(w) + 1;
        return `
          <div class="work-card">
            <span class="work-number">#${String(idx).padStart(2, '0')}</span>
            <h3 class="work-title">${escapeHtml(w.title)}</h3>
            ${w.date ? `<div class="work-date">📅 ${formatDate(w.date)}</div>` : ''}
            ${w.desc ? `<p class="work-desc">${escapeHtml(w.desc)}</p>` : '<p class="work-desc"></p>'}
            <a class="work-url" href="${escapeHtml(w.url)}" target="_blank" rel="noopener" title="Abrir em nova aba">
              🔗 ${escapeHtml(w.url)}
            </a>
            <a class="open-btn" href="${escapeHtml(w.url)}" target="_blank" rel="noopener">
              <span class="mini-ball"></span>
              Abrir Trabalho
            </a>
            <div class="work-actions">
              <button class="btn btn-secondary btn-sm" onclick="editWork(${w.id})">✏️ Editar</button>
              <button class="btn btn-danger btn-sm" onclick="removeWork(${w.id})">🗑️ Excluir</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ============================================
    // AÇÕES
    // ============================================
    function addWork(title, url, desc, date) {
      works.push({
        id: Date.now() + Math.floor(Math.random() * 1000),
        title,
        url,
        desc,
        date
      });
      save();
      render();
      showToast('✅ Trabalho adicionado!');
    }

    function editWork(id) {
      const w = works.find(x => x.id === id);
      if (!w) return;

      const title = prompt('Título:', w.title);
      if (title === null) return;

      const url = prompt('Link:', w.url);
      if (url === null) return;

      const desc = prompt('Descrição:', w.desc || '');
      if (desc === null) return;

      w.title = title.trim() || w.title;
      w.url = normalizeUrl(url) || w.url;
      w.desc = desc.trim();
      save();
      render();
      showToast('✏️ Trabalho atualizado!');
    }

    function removeWork(id) {
      const w = works.find(x => x.id === id);
      if (!w) return;
      if (!confirm(`Excluir "${w.title}"?`)) return;
      works = works.filter(x => x.id !== id);
      save();
      render();
      showToast('🗑️ Trabalho removido');
    }

    // ============================================
    // EVENTOS
    // ============================================
    document.getElementById('toggleFormBtn').addEventListener('click', () => {
      const box = document.getElementById('formBox');
      box.classList.toggle('open');
      if (box.classList.contains('open')) {
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('workTitle').value.trim();
      const url = normalizeUrl(document.getElementById('workUrl').value);
      const desc = document.getElementById('workDesc').value.trim();
      const date = document.getElementById('workDate').value;

      if (!title || !url) return;

      addWork(title, url, desc, date);

      document.getElementById('addForm').reset();
      document.getElementById('workDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('formBox').classList.remove('open');
    });

    // Exportar JSON
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(works, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `portfolio-dbz-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('💾 Backup JSON baixado!');
    });

    // Gerar código do array (para colar em DEFAULT_WORKS)
    document.getElementById('codeBtn').addEventListener('click', () => {
      const code = 'const DEFAULT_WORKS = ' + JSON.stringify(works, null, 2) + ';';
      navigator.clipboard.writeText(code)
        .then(() => showToast('📋 Código copiado! Cole em DEFAULT_WORKS'))
        .catch(() => {
          // fallback: mostra em prompt
          prompt('Copie o código abaixo e cole em DEFAULT_WORKS:', code);
        });
    });

    // Importar JSON
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!Array.isArray(data)) throw new Error('Formato inválido');
          if (!confirm(`Importar ${data.length} trabalho(s)? Isso substituirá os atuais.`)) return;
          works = data;
          save();
          render();
          showToast('📂 Importado com sucesso!');
        } catch (err) {
          alert('Arquivo inválido: ' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    function init() {
      load();
      document.getElementById('workDate').value = new Date().toISOString().split('T')[0];
      render();
    }

    init();
  </script>
</body>
</html>
